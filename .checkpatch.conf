--codespell
--no-tree
--quiet
--strict
--max-line-length=80
--ignore=CAMELCASE
--ignore=CONCATENATED_STRING
--ignore=FILE_PATH_CHANGES
--ignore=GERRIT_CHANGE_ID
--ignore=NOT_UNIFIED_DIFF
--ignore=STRLCPY
--ignore=PREFER_KERNEL_TYPES
--ignore=USLEEP_RANGE
--kconfig-prefix=CONFIG_
# The tree is configured with Kconfig; the kernel's rule of a four-line
# help text per option is not followed here.
--ignore=CONFIG_DESCRIPTION
